<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleBookmark.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <title>Bookmark</title>
</head>
<body>
    <nav class="Navbar_sticky">
        <section class="section_button">
            <a href="Home.html" class="a-style_navbar">
                <div class="logo_navbar">
                    <i class="ri-home-3-line"></i>
                </div>
            </a>
            
            <a href="About.html" class="a-style_navbar">
                <div class="logo_navbar">
                    <i class="ri-user-3-line"></i>
                </div>
            </a>
            
            <a href="Contact.html" class="a-style_navbar">
                <div class="logo_navbar">
                    <i class="ri-phone-line"></i>
                </div>
            </a>
            <a href="Bookmark.html" class="a-style_navbar">
                <div class="logo_navbar">
                    <i class="ri-bookmark-line"></i>
                </div>
            </a>
        </section>
    </nav>

    <section class="section">
        <div style="display: flex; flex-direction: row;">
            <i class="ri-book-3-line">
                <P>MyElibrary.co</P>
            </i>
        </div>
        <a href="FAQ.html">
            <div class="Faq_btn">
                    <i class="ri-question-answer-line"></i>
                    <p>
                        FAQ
                    </p>
            </div>
        </a>
    </section>

    <header>
        <h2>
            Your Personal 
            <br>Bookmark
        </h2>
    </header>

    <main class="Container_listbook">
        <div class="box_book">
            <img src="Resorce/Book10.png" alt="Bookmarked1">
            <h5>
                How To <b>Talk</b> To Anyone
            </h5>
            <p>
                by jordan Platz
            </p>

            <div class="icon_box">
                <div class="box_left">
                    <i class="ri-bookmark-fill"></i>
                    <p>
                        140k
                    </p>
                    <i class="ri-share-2-line"></i>
                    <p>
                        12k
                    </p>
                </div>
                <div class="box_right">
                    <i class="ri-copyright-line"></i>
                    <p>
                        Copyright
                    </p>
                </div>
            </div>

            <section class="section_btn_read">
                <p>
                    Continue Read
                </p>
                <i class="ri-arrow-right-up-line"></i>
            </section>
        </div>

        <div class="box_book">
            <img src="Resorce/Book2.png" alt="Bookmarked2">
            <h5>
                The Longest <br>Talk
            </h5>
            <p>
                by Avery Bainez
            </p>

            <div class="icon_box">
                <div class="box_left">
                    <i class="ri-bookmark-fill"></i>
                    <p>
                        10k
                    </p>
                    <i class="ri-share-2-line"></i>
                    <p>
                        1.2k
                    </p>
                </div>
                <div class="box_right">
                    <i class="ri-copyright-line"></i>
                    <p>
                        Copyright
                    </p>
                </div>
            </div>

            <section class="section_btn_read">
                <p>
                    Continue Read
                </p>
                <i class="ri-arrow-right-up-line"></i>
            </section>
        </div>
    </main>

</body>
</html>
